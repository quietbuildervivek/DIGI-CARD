<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My CollegeCard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="mark" href="index.html" style="text-decoration:none;">College<span>Card</span></a>
    <a class="link" href="create-profile.html">Edit →</a>
  </div>

  <div id="profileArea"><!-- filled by script.js --></div>

</div>

<script src="js/script.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const profile = CollegeCard.load();
    const area = document.getElementById('profileArea');

    if (!profile) {
      area.innerHTML = `
        <div class="empty">
          <p>No profile saved on this browser yet.</p>
          <a class="primary-link" href="create-profile.html">Create your card</a>
        </div>`;
      return;
    }

    const skillsHtml = profile.skills.length
      ? `<div class="skills">${profile.skills.map(s => `<span class="skill-chip">${CollegeCard.escape(s)}</span>`).join('')}</div>`
      : '';

    const socialLinks = [
      { key: 'github', label: 'GitHub' },
      { key: 'linkedin', label: 'LinkedIn' },
      { key: 'instagram', label: 'Instagram' },
    ].filter(s => profile[s.key]);

    const socialsHtml = socialLinks.length
      ? `<div class="socials">${socialLinks.map(s => `<a href="${CollegeCard.escape(profile[s.key])}" target="_blank" rel="noopener">${s.label}</a>`).join('')}</div>`
      : '';

    area.innerHTML = `
      <div class="id-card">
        <div class="stripe"></div>
        <div class="id-eyebrow">STUDENT ID · ${CollegeCard.escape(profile.branch)} '${CollegeCard.escape(profile.year)}</div>
        <div class="id-name">${CollegeCard.escape(profile.name)}</div>
        <div class="id-meta">${CollegeCard.escape(profile.college)}</div>
        ${profile.bio ? `<div class="id-bio">${CollegeCard.escape(profile.bio)}</div>` : ''}
        ${skillsHtml}
        <div class="id-number">ID — ${CollegeCard.escape(profile.id)}</div>
      </div>

      ${socialsHtml}

      <div class="qr-note">
        QR code goes here in Phase 8 — it will point to this profile's public URL once the backend exists.
      </div>

      <div class="actions">
        <a href="create-profile.html">Edit profile</a>
        <button class="danger" id="clearBtn" type="button">Delete profile</button>
      </div>
    `;

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('Delete this profile from your browser? This cannot be undone.')) {
        CollegeCard.clear();
        window.location.reload();
      }
    });
  });
</script>
</body>
</html>
