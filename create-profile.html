<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Profile — CollegeCard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">College<span>Card</span></div>
    <a href="index.html" class="btn btn-secondary">Home</a>
  </nav>

  <!-- ================= FORM ================= -->
  <div class="form-wrap">
    <div class="form-card">
      <h1>Create your CollegeCard</h1>
      <p class="form-subtitle">Fill this in — your preview appears below once you submit.</p>

      <form id="profile-form" novalidate>

        <div class="field">
          <label for="name">Full name *</label>
          <input type="text" id="name" required>
        </div>

        <div class="field">
          <label for="college">College *</label>
          <input type="text" id="college" required>
        </div>

        <div class="field">
          <label for="branch">Branch</label>
          <input type="text" id="branch">
        </div>

        <div class="field">
          <label for="year">Year</label>
          <select id="year">
            <option value="">Select year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
          </select>
        </div>

        <div class="field">
          <label for="bio">Short bio</label>
          <textarea id="bio" rows="3" placeholder="About you"></textarea>
        </div>

        <div class="field">
          <label for="skills">Skills (comma separated)</label>
          <input type="text" id="skills" placeholder="Python, JavaScript, Flask">
        </div>

        <div class="field">
          <label for="github">GitHub URL</label>
          <input type="url" id="github" placeholder="https://github.com/yourname">
        </div>

        <div class="field">
          <label for="linkedin">LinkedIn URL</label>
          <input type="url" id="linkedin" placeholder="https://linkedin.com/in/yourname">
        </div>

        <div class="field">
          <label for="instagram">Instagram URL</label>
          <input type="url" id="instagram" placeholder="https://instagram.com/yourname">
        </div>

        <p id="form-error" class="error-text"></p>

        <button type="submit" class="btn btn-primary btn-block">Create Profile</button>
      </form>
    </div>
  </div>

  <!-- ================= LIVE PREVIEW ================= -->
  <!-- Same markup/classes as profile.html so the preview matches the real page exactly -->
  <div class="profile-wrap hidden" id="profile-preview">
    <div class="profile-card">

      <div class="profile-photo" id="preview-photo"></div>

      <h1 id="preview-name"></h1>
      <p class="profile-meta" id="preview-meta"></p>

      <p class="profile-bio" id="preview-bio"></p>

      <div class="skills" id="preview-skills"></div>

      <div class="social-links" id="preview-social"></div>

      <div class="qr-area">
        QR code will render here (Phase 8)
      </div>

    </div>
    <p class="preview-hint">This is a live preview only — nothing is saved yet. Persistence comes in Phase 3.</p>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
